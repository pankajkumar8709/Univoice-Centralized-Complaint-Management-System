<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Complaint Management System - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --success-color: #48bb78;
            --warning-color: #ed8936;
            --danger-color: #f56565;
            --dark-color: #2d3748;
            --light-color: #f7fafc;
            --border-radius: 15px;
            --box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Animated background elements */
        .bg-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
        }

        .shape1 {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape2 {
            width: 60px;
            height: 60px;
            top: 60%;
            right: 20%;
            animation-delay: 3s;
        }

        .shape3 {
            width: 100px;
            height: 100px;
            bottom: 20%;
            left: 20%;
            animation-delay: 6s;
        }

        .shape4 {
            width: 40px;
            height: 40px;
            top: 30%;
            right: 10%;
            animation-delay: 9s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-30px) rotate(120deg); }
            66% { transform: translateY(20px) rotate(240deg); }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .university-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .university-logo i {
            font-size: 2.5rem;
            color: white;
        }

        .header h1 {
            color: var(--dark-color);
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            color: #718096;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        /* User type selector */
        .user-type-selector {
            display: flex;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 30px;
            position: relative;
        }

        .user-type-option {
            flex: 1;
            padding: 12px 8px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 0.9rem;
            position: relative;
            z-index: 2;
        }

        .user-type-option.active {
            background: white;
            color: var(--primary-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .user-type-option:not(.active) {
            color: #64748b;
        }

        .user-type-option:not(.active):hover {
            color: var(--primary-color);
        }

        /* Form styles */
        .login-form {
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--dark-color);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            z-index: 2;
        }

        .form-control {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
            font-family: inherit;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-control:focus + i {
            color: var(--primary-color);
        }

        /* Dynamic label styling */
        .username-label {
            transition: all 0.3s ease;
        }

        /* Login button */
        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* Flash messages */
        .flash-messages {
            margin-bottom: 20px;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-success {
            background-color: #f0fff4;
            color: #38a169;
            border: 1px solid #c6f6d5;
        }

        .alert-error {
            background-color: #fed7d7;
            color: #e53e3e;
            border: 1px solid #feb2b2;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .footer p {
            color: #718096;
            font-size: 0.8rem;
        }

        /* Responsive design */
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
                margin: 10px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .user-type-option {
                padding: 10px 6px;
                font-size: 0.8rem;
            }

            .form-control {
                padding: 12px 12px 12px 40px;
            }
        }

        /* Loading animation */
        .loading {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-btn.loading .loading {
            display: block;
        }

        .login-btn.loading .btn-text {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Animated background shapes -->
    <div class="bg-shapes">
        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
        <div class="shape shape3"></div>
        <div class="shape shape4"></div>
    </div>

    <div class="login-container">
        <!-- Header -->
        <div class="header">
            <div class="university-logo">
                <i class="fas fa-university"></i>
            </div>
            <h1>Welcome Back</h1>
            <p>Sign in to access the University Complaint Management System</p>
            
            <!-- User Type Selector -->
            <div class="user-type-selector">
                <div class="user-type-option active" data-type="student">
                    <i class="fas fa-user-graduate"></i> Student
                </div>
                <div class="user-type-option" data-type="teacher">
                    <i class="fas fa-chalkboard-teacher"></i> Teacher
                </div>
                <div class="user-type-option" data-type="admin">
                    <i class="fas fa-user-shield"></i> Admin
                </div>
            </div>
        </div>

        <!-- Flash Messages -->
        {% include 'flash.html' %}

        <!-- Login Form -->
        <form class="login-form" method="POST" id="loginForm">
            <input type="hidden" name="user_type" id="userType" value="student">
            
            <div class="form-group">
                <label for="username" class="username-label">Roll Number</label>
                <div class="input-wrapper">
                    <input type="text" class="form-control" id="username" name="username" required>
                    <i class="fas fa-user"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" class="form-control" id="password" name="password" required>
                    <i class="fas fa-lock"></i>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <div class="loading"></div>
                <span class="btn-text">
                    <i class="fas fa-sign-in-alt"></i>
                    Sign In
                </span>
            </button>
        </form>
        <div style="margin: 20px;text-align: center;">
            Go back to <a style="text-decoration: none;" href="{{ url_for('home') }}">Home</a>
        </div>
        <!-- Footer -->
        <div class="footer">
            <p>&copy; 2024 University Complaint Management System. All rights reserved.</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const userTypeOptions = document.querySelectorAll('.user-type-option');
            const usernameLabel = document.querySelector('.username-label');
            const usernameInput = document.getElementById('username');
            const userTypeInput = document.getElementById('userType');
            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');

            // User type configuration
            const userConfig = {
                student: {
                    label: 'Roll Number',
                    placeholder: 'Enter your roll number',
                    icon: 'fas fa-user-graduate'
                },
                teacher: {
                    label: 'Employee ID',
                    placeholder: 'Enter your employee ID',
                    icon: 'fas fa-id-badge'
                },
                admin: {
                    label: 'Admin ID',
                    placeholder: 'Enter your admin ID',
                    icon: 'fas fa-user-shield'
                }
            };

            // Handle user type selection
            userTypeOptions.forEach(option => {
                option.addEventListener('click', function() {
                    // Remove active class from all options
                    userTypeOptions.forEach(opt => opt.classList.remove('active'));
                    
                    // Add active class to clicked option
                    this.classList.add('active');
                    
                    // Get selected user type
                    const selectedType = this.dataset.type;
                    userTypeInput.value = selectedType;
                    
                    // Update form based on user type
                    updateFormForUserType(selectedType);
                });
            });

            function updateFormForUserType(userType) {
                const config = userConfig[userType];
                
                // Update label and placeholder
                usernameLabel.textContent = config.label;
                usernameInput.placeholder = config.placeholder;
                
                // Update input icon
                const inputIcon = usernameInput.parentElement.querySelector('i');
                inputIcon.className = config.icon;
                
                // Clear input value
                usernameInput.value = '';
                usernameInput.focus();
            }

            // Handle form submission
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Show loading state
                loginBtn.classList.add('loading');
                
                // Get form data
                const formData = new FormData(loginForm);
                const userType = formData.get('user_type');
                
                // Update form field names based on user type
                if (userType === 'student') {
                    formData.set('roll', formData.get('username'));
                    formData.delete('username');
                } else if (userType === 'teacher') {
                    formData.set('empid', formData.get('username'));
                    formData.delete('username');
                } else if (userType === 'admin') {
                    // Keep as username for admin
                }
                
                // Submit form
                setTimeout(() => {
                    loginBtn.classList.remove('loading');
                    loginForm.submit();
                }, 500);
            });

            // Initialize form for student (default)
            updateFormForUserType('student');
        });

        // Add some interactive effects
        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.parentElement.style.transform = 'translateY(-2px)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.parentElement.style.transform = 'translateY(0)';
            });
        });
    </script>
</body>
</html>
